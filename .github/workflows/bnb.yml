name: bnb

on:
  schedule:
    - cron: "17 */6 * * *"   # safety net; each pass re-dispatches the next one itself
  workflow_dispatch:
    inputs:
      mode:
        description: "run = extraction, probe = test the live API only"
        default: run
        type: choice
        options: [run, probe]
      time_budget:
        description: "Minutes of work before stopping"
        default: "290"

permissions:
  contents: write
  actions: write

concurrency:
  group: bnb
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      NBB_KEY: ${{ secrets.NBB_KEY }}
      MODE: ${{ inputs.mode || 'run' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check key
        run: test -n "$NBB_KEY" || { echo "::error::Repository secret NBB_KEY is not set."; exit 1; }

      - name: Probe live API
        if: env.MODE == 'probe'
        run: python bnb.py probe

      - name: Check state
        id: check
        if: env.MODE == 'run'
        run: |
          if [ -f state/TERMINE ]; then echo "Already finished:"; cat state/TERMINE; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          test -f data/bce_industrie.csv.gz || {
            echo "::error::data/bce_industrie.csv.gz missing. Run the 'population' workflow or commit it.";
            exit 1; }
          echo "go=true" >> "$GITHUB_OUTPUT"

      - name: Extract
        if: env.MODE == 'run' && steps.check.outputs.go == 'true'
        env:
          TIME_BUDGET: ${{ inputs.time_budget || '290' }}
          WORKERS: "6"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Push only the small progress file every 10 minutes so the run can be followed live.
          # It goes through a separate worktree: never touch the files bnb.py is appending to.
          git worktree add -q --detach "$RUNNER_TEMP/progress" HEAD
          (
            while sleep 600; do
              [ -f state/progres.md ] || continue
              (
                cd "$RUNNER_TEMP/progress" &&
                git fetch -q origin "${GITHUB_REF_NAME}" &&
                git reset -q --hard FETCH_HEAD &&
                mkdir -p state && cp "$GITHUB_WORKSPACE/state/progres.md" state/ &&
                git add state/progres.md &&
                git commit -qm "bnb: progrès $(date -u +%H:%MZ)" &&
                git push -q origin "HEAD:${GITHUB_REF_NAME}"
              ) || echo "progress push failed"
            done
          ) &
          python bnb.py

      - name: Commit state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/ 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "bnb: ${MODE} $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((2 ** i))
          done
          exit 1

      - name: Chain next pass
        if: success() && env.MODE == 'run' && steps.check.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git pull -q origin "${GITHUB_REF_NAME}" || true
          if [ -f state/TERMINE ]; then echo "Finished, not chaining."; exit 0; fi
          gh workflow run bnb.yml --ref "${GITHUB_REF_NAME}" -f mode=run
