name: bnb

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      time_budget:
        description: "Minutes of work before stopping"
        default: "290"

permissions:
  contents: write

concurrency:
  group: bnb
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check population file
        run: |
          test -f data/bce_industrie.csv.gz || {
            echo "::error::data/bce_industrie.csv.gz missing. Build it with: python build_population.py KboOpenData_XXXX_Full.zip";
            exit 1; }

      - name: Extract
        env:
          NBB_KEY: ${{ secrets.NBB_KEY }}
          TIME_BUDGET: ${{ inputs.time_budget || '290' }}
          WORKERS: "6"
        run: python bnb.py

      - name: Commit state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          git diff --cached --quiet && exit 0
          git commit -m "bnb: state $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((2 ** i))
          done
          exit 1
