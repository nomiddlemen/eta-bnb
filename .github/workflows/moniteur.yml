name: moniteur

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe = raw pages for the two test cases; fetch = all targets with OCR"
        default: fetch
        type: choice
        options: [probe, fetch]
      only:
        description: "Optional space-separated company numbers (fetch mode)"
        required: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe
        if: inputs.mode == 'probe'
        run: python moniteur/probe.py
      - name: Install OCR
        if: inputs.mode == 'fetch'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-fra tesseract-ocr-nld tesseract-ocr-deu poppler-utils
      - name: Fetch
        if: inputs.mode == 'fetch'
        env:
          TIME_BUDGET: "100"
        run: python moniteur/fetch.py ${{ inputs.only }}
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add moniteur/
          git diff --cached --quiet && exit 0
          git commit -m "moniteur: ${{ inputs.mode }} $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"
