name: moniteur

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe = save raw pages for the two test cases"
        default: probe
        type: choice
        options: [probe]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe
        if: inputs.mode == 'probe'
        run: python moniteur/probe.py
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add moniteur/
          git diff --cached --quiet && exit 0
          git commit -m "moniteur: ${{ inputs.mode }} $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"
