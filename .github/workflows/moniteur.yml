name: moniteur

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe = raw pages for the two test cases; fetch = all targets with OCR"
        default: fetch
        type: choice
        options: [probe, fetch]
      only:
        description: "Optional space-separated company numbers (fetch mode)"
        required: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe
        if: inputs.mode == 'probe' && matrix.shard == 0
        run: python moniteur/probe.py
      - name: Install OCR
        if: inputs.mode == 'fetch'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-fra tesseract-ocr-nld tesseract-ocr-deu poppler-utils
      - name: Fetch
        if: inputs.mode == 'fetch'
        env:
          TIME_BUDGET: "100"
          PAUSE: "1.0"
          SHARD: ${{ matrix.shard }}
          NSHARDS: "4"
        run: python moniteur/fetch.py ${{ inputs.only }}
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add moniteur/
          git diff --cached --quiet && exit 0
          git commit -m "moniteur: ${{ inputs.mode }} shard ${{ matrix.shard }} $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((RANDOM % 20 + 5))
          done
          exit 1
